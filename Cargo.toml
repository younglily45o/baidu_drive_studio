[package]
name = "baidu-drive-studio"
version = "0.3.0"
edition = "2024"
description = "A native Rust Baidu Netdisk client with Cookie and OAuth login"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
md5 = "0.7"
base64 = "0.22"
crc32fast = "1"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11"], optional = true }
rfd = { version = "=0.15.4", default-features = false, features = ["xdg-portal", "async-std"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[dev-dependencies]
tempfile = "=3.27.0"

[[bin]]
name = "Baidu-Drive-Studio"
path = "src/main.rs"
required-features = ["desktop"]

[profile.release]
opt-level = 2
lto = "thin"
strip = "debuginfo"
